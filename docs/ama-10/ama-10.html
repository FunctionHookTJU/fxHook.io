<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ama-10</title>
  <style>
    /* ======== Original inline styles ======== */
    html,
    body {
      background-color: #000000;
    }

    #bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      isolation: isolate;
    }

    #signal-pulse {
      position: absolute;
      left: 0;
      right: 0;
      top: 55vh;
      height: 3px;
      background: #bbff00;
      mix-blend-mode: multiply;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
    }

    #signal-pulse.flash {
      animation: signalFlash 90ms ease-out;
    }

    @keyframes signalFlash {
      0% { opacity: 0; }
      40% { opacity: 1; }
      100% { opacity: 0; }
    }

    #terminal {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      pointer-events: none;
      padding: 2rem 2rem 5vh;
      overflow: hidden;
    }

    #terminal-lines {
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.7;
      max-width: min(90vw, 560px);
      white-space: pre-wrap;
      word-break: break-all;
      text-align: left;
      color: var(--fg-accent);
      pointer-events: none;
    }

    .line {
      min-height: 1.5em;
    }

    .line.error {
      color: var(--fg-error);
    }

    .line.dim {
      color: var(--fg-dim);
    }

    #input {
      position: fixed;
      top: 95%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      max-width: 400px;
      height: 3rem;
      background: transparent;
      border: none;
      outline: none;
      color: transparent;
      caret-color: transparent;
      font-family: var(--mono);
      font-size: 14px;
      z-index: 3;
      opacity: 0;
      pointer-events: auto;
      padding: 0;
    }

    /* ======== ama-10 shared styles (from puzzle.js) ======== */
    :root {
      --bg: #050505;
      --fg: #e8e8e8;
      --fg-dim: #6a6a6a;
      --fg-accent: #c8c8c8;
      --fg-error: #c66;
      --signal: #bbff00;
      --mono: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, "Liberation Mono", Menlo, "Courier New", monospace;
      --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .accent {
      color: var(--signal);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body {
      position: relative;
    }

    @keyframes blink {
      0%, 49% { opacity: 0.65; }
      50%, 100% { opacity: 0; }
    }

    .cursor-underline {
      display: inline-block;
      width: 0.55em;
      border-bottom: 2px solid var(--fg);
      vertical-align: text-bottom;
      animation: blink 1.1s steps(1) infinite;
      margin-left: 2px;
    }

    #orientation-gate { display: none; }

    @media (orientation: portrait) and (max-width: 900px) {
      #orientation-gate {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.9;
        padding: 0 2rem;
        text-align: left;
      }
      #orientation-gate p { margin: 0; }
    }

    ::selection {
      background: #333;
      color: var(--fg);
    }
  </style>
</head>
<body>
  <div id="bg-wrap">
    <div data-ascii-dither-bg aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
    <div id="signal-pulse" aria-hidden="true"></div>
  </div>
  <main id="terminal" role="presentation">
    <div id="terminal-lines"></div>
  </main>
  <input id="input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="terminal input">
  <div id="orientation-gate" aria-hidden="true">
    <p>> portrait mode not supported.</p>
    <p>> rotate device to continue.</p>
  </div>

</body>
</html>
