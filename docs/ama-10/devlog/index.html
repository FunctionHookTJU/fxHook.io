<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ama-10 // devlog</title>
  <style>
    html,
    body {
      background-color: #000000;
    }

    #bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 1;
      transition: opacity 800ms ease;
    }

    #bg-wrap.fading {
      opacity: 0;
    }

    main {
      position: relative;
      z-index: 2;
      max-width: 760px;
      margin: 0 auto;
      padding: 4rem 1.75rem 6rem;
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.8;
      color: var(--fg-accent);
    }

    .line {
      white-space: pre-wrap;
      min-height: 1.7em;
    }

    .line.dim { color: var(--fg-dim); }
    .line.error { color: var(--fg-error); }

    .line.fade-in {
      opacity: 0;
      animation: fadeIn 260ms ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .entry-header {
      cursor: pointer;
      user-select: none;
      transition: color 180ms ease;
      display: block;
    }

    .entry-header:hover,
    .entry-header:focus-visible {
      color: var(--fg);
      outline: none;
    }

    .entry-header .arrow {
      display: inline-block;
      width: 1.2em;
      color: var(--fg-dim);
      transition: color 220ms ease;
    }

    .entry-header.open .arrow {
      color: var(--fg);
      animation: arrowOpen 720ms ease-out;
    }

    .entry-header .arrow.pulse {
      animation: arrowPulse 720ms ease-out;
    }

    @keyframes arrowOpen {
      0%   { color: var(--fg-dim); }
      15%  { color: var(--signal); }
      50%  { color: var(--signal); }
      100% { color: var(--fg); }
    }

    @keyframes arrowPulse {
      0%   { color: var(--fg-dim); }
      30%  { color: var(--signal); }
      100% { color: var(--fg-dim); }
    }

    .entry-header .time {
      color: var(--fg-dim);
    }

    .entry-body {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      margin: 0;
      padding-left: 2.4em;
      font-family: var(--sans);
      color: var(--fg);
      line-height: 1.95;
      font-size: 15.5px;
      transition: max-height 320ms ease, opacity 280ms ease, margin 280ms ease, padding 280ms ease;
    }

    .entry-body.open {
      max-height: 1800px;
      opacity: 1;
      margin: 0.5rem 0 1.75rem;
      padding-top: 0.25rem;
      padding-bottom: 0.25rem;
    }

    .entry-body p {
      margin: 0 0 0.9em;
    }

    .entry-body p:last-child {
      margin-bottom: 0;
    }

    .entry-body .meta {
      font-family: var(--mono);
      color: var(--fg-dim);
      font-size: 13.5px;
      margin-bottom: 0.9em;
    }

    #ending {
      margin-top: 2.5rem;
    }

    #ending .line {
      opacity: 0;
      transition: opacity 460ms ease;
    }

    #ending .line.show {
      opacity: 1;
    }

    .entry-header:focus {
      outline: none;
    }

    /* ama-10 shared styles (from devlog JS) */
    :root {
      --bg: #050505;
      --fg: #e8e8e8;
      --fg-dim: #6a6a6a;
      --fg-accent: #c8c8c8;
      --fg-error: #c66;
      --signal: #bbff00;
      --mono: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, "Liberation Mono", Menlo, "Courier New", monospace;
      --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .accent { color: var(--signal); }
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body { position: relative; }

    @keyframes blink {
      0%, 49% { opacity: 0.65; }
      50%, 100% { opacity: 0; }
    }

    .cursor-underline {
      display: inline-block;
      width: 0.55em;
      border-bottom: 2px solid var(--fg);
      vertical-align: text-bottom;
      animation: blink 1.1s steps(1) infinite;
      margin-left: 2px;
    }

    #orientation-gate { display: none; }

    @media (orientation: portrait) and (max-width: 900px) {
      #orientation-gate {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.9;
        padding: 0 2rem;
        text-align: left;
      }
      #orientation-gate p { margin: 0; }
    }

    ::selection { background: #333; color: var(--fg); }

    @media (max-width: 900px) and (orientation: landscape) {
      main {
        padding: 2rem 1.5rem 3rem;
        font-size: 13px;
      }
      .entry-body { font-size: 14.5px; }
    }
  </style>
</head>
<body>
  <div id="bg-wrap">
    <div data-ascii-dither-bg aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
  </div>
  <main id="terminal" aria-live="polite"></main>
  <div id="orientation-gate" aria-hidden="true">
    <p>> portrait mode not supported.</p>
    <p>> rotate device to continue.</p>
  </div>
  <script src="devlog.e74053ce.js"></script>
</body>
</html>
